[package]
name = "zeroclaw-typesafe-eval"
version = "0.1.0"
edition = "2024"
publish = false

# Offline analysis only; deliberately no runtime, MCP, HTTP or agent dependency.
[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hmac = "0.12"
sha2 = "0.10"
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[workspace]
