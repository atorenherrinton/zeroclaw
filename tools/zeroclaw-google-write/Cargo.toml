[package]
name = "zeroclaw-google-write"
version = "0.3.0"
edition = "2024"
publish = false

# Independently installed MCP connector, like the other local tools.
[workspace]

[dependencies]
anyhow = "1"
chrono = "0.4"
chrono-tz = "0.10"
serde_json = "1"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "process", "rt-multi-thread", "signal", "time"] }

rusqlite = { version = "0.37", features = ["bundled"] }
sha2 = "0.10"
zeroclaw-personal-ops = { path = "../zeroclaw-personal-ops" }

[dev-dependencies]
tempfile = "3"
