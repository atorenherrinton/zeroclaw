[package]
name = "zeroclaw-github-cli"
version = "0.1.1"
edition = "2021"

[[bin]]
name = "zeroclaw-github-cli"
path = "src/main.rs"

[workspace]

[dependencies]
anyhow = "1"
serde_json = "1"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "process", "rt-multi-thread", "signal", "time"] }

[profile.release]
strip = true
lto = true
codegen-units = 1

[dev-dependencies]
tempfile = "3"
