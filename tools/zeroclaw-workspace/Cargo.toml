[package]
name = "zeroclaw-workspace"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false

[workspace]

[dependencies]
anyhow = "1"
base64 = "0.22"
getrandom = "0.2"
libc = "0.2"
hmac = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "io-std", "io-util", "net"] }
zeroize = "1"
zeroclaw-gmail = { path = "../zeroclaw-gmail" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString"] }
block2 = "0.6"
security-framework = "3"
security-framework-sys = "2"

[dev-dependencies]
tempfile = "3"
