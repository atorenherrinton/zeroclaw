[package]
name = "zeroclaw-public-browser"
version = "0.1.1"
edition = "2024"
publish = false

[dependencies]
zeroclaw-spawn = { path = "../../crates/zeroclaw-spawn" }
anyhow = "1"
tokio = { version = "1.50", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "process", "io-util", "io-std"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2.5"
libc = "0.2"

[profile.release]
strip = true


[workspace]
