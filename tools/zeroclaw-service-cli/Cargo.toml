[package]
name = "zeroclaw-service-cli"
version = "0.2.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["io-std", "io-util", "macros", "rt-multi-thread", "time", "process"] }
zeroize = "1"
rpassword = "7"
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[profile.release]
strip = true
lto = true
codegen-units = 1
