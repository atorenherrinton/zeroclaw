# Merge into the owner's existing config; this is not a standalone installation.
# Deliberately disabled and unrouted until owner-led onboarding is complete.
[agents.reading_coach]
enabled = false
model_provider = "" # Set to an existing owner-approved model-provider alias.
risk_profile = "reading_coach"
runtime_profile = "reading_coach"
channels = []
mcp_bundles = []
skill_bundles = []
knowledge_bundles = []
cron_jobs = []
delegate_same_risk_profile = false
delegates = []
acp_enable_mcp = false

[risk_profiles.reading_coach]
level = "supervised"
workspace_only = true
allowed_commands = []
allowed_roots = []
allowed_tools = ["reading_coach"]
auto_approve = ["reading_coach"]
always_ask = []
require_approval_for_medium_risk = true
block_high_risk_commands = true
shell_env_passthrough = []

[risk_profiles.reading_coach.delegation_policy]
mode = "forbidden"

[runtime_profiles.reading_coach]
agentic = true # Bounded tool loop, not permission for autonomous actions.
max_tool_iterations = 3
max_actions_per_hour = 20
max_cost_per_day_cents = 100
max_delegation_depth = 0
max_history_messages = 12
max_tool_result_chars = 4000
